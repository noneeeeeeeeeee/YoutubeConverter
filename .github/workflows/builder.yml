name: Build and Draft Release

on:
  push:
    branches:
      - dev-build
      - main

permissions:
  contents: write

jobs:
  build-nightly:
    if: github.ref == 'refs/heads/dev-build'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.0"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Prepare Nightly package
        id: nightly_pkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path YTConverter | Out-Null
          Copy-Item -Path build\windows\x64\runner\Release\* -Destination YTConverter -Recurse

          # Nightly version
          $short = $env:GITHUB_SHA.Substring(0,7)
          $nightlyVer = "Nightly Build $short"
          $nightlyVer | Out-File -Encoding ascii YTConverter\version.txt -Force

          # Copy icon
          if (Test-Path "YTConverterIcon.png") {
            Copy-Item YTConverterIcon.png YTConverter\ -Force
          }

          $nightlyZip = "YoutubeConverter_Nightly.zip"
          Compress-Archive -Path YTConverter\* -DestinationPath $nightlyZip -Force
          "nightly_zip=$nightlyZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "nightly_ver=$nightlyVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Nightly Pre-release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: nightly
          prerelease: true
          title: ${{ steps.nightly_pkg.outputs.nightly_ver }}
          files: |
            ${{ steps.nightly_pkg.outputs.nightly_zip }}

  build-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.0"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Prepare Release package
        id: release_pkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path YTConverter | Out-Null
          Copy-Item -Path build\windows\x64\runner\Release\* -Destination YTConverter -Recurse

          if (Test-Path "version.txt") {
            $repoVer = (Get-Content -Raw version.txt).Trim()
            Copy-Item version.txt YTConverter\version.txt -Force
          } else {
            $repoVer = "1.0.0"
            '1.0.0' | Out-File -Encoding ascii YTConverter\version.txt
          }

          # Copy icon
          if (Test-Path "YTConverterIcon.png") {
            Copy-Item YTConverterIcon.png YTConverter\ -Force
          }

          $safe = $repoVer -replace '[^\w\.\-]','_'
          $verZip = "YoutubeConverter_$safe.zip"
          Compress-Archive -Path YTConverter\* -DestinationPath $verZip -Force
          "ver_zip=$verZip" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ver=$repoVer"  | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Update Release Draft
        id: draft
        uses: release-drafter/release-drafter@v5
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set draft title/tag from version.txt
        uses: actions/github-script@v7
        env:
          REL_ID: ${{ steps.draft.outputs.id }}
          VER: ${{ steps.release_pkg.outputs.ver }}
        with:
          script: |
            const release_id = process.env.REL_ID;
            const ver = process.env.VER;
            if (!release_id || !ver) {
              core.info('Release ID or version missing; skipping rename.');
            } else {
              await github.request('PATCH /repos/{owner}/{repo}/releases/{release_id}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id,
                tag_name: `v${ver}`,
                name: `v${ver}`,
              });
              core.info(`Draft release updated to v${ver}`);
            }

      - name: Delete existing asset if present
        uses: actions/github-script@v7
        env:
          REL_ID: ${{ steps.draft.outputs.id }}
          ASSET_NAME: ${{ steps.release_pkg.outputs.ver_zip }}
        with:
          script: |
            const release_id = process.env.REL_ID;
            const assetName = process.env.ASSET_NAME;
            if (!release_id || !assetName) {
              core.info('Release ID or asset name missing; skip delete.');
              return;
            }
            const { data: assets } = await github.request('GET /repos/{owner}/{repo}/releases/{release_id}/assets', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id,
            });
            const match = (assets || []).find(a => a.name === assetName);
            if (match) {
              await github.request('DELETE /repos/{owner}/{repo}/releases/assets/{asset_id}', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: match.id,
              });
              core.info(`Deleted existing asset: ${assetName}`);
            } else {
              core.info('No existing asset to delete.');
            }

      - name: Upload asset to Draft Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.release_pkg.outputs.ver }}
          draft: true
          files: |
            ${{ steps.release_pkg.outputs.ver_zip }}
          fail_on_unmatched_files: true

  build-linux:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.0"
          channel: "stable"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      - name: Prepare Linux package
        id: linux_pkg
        run: |
          mkdir -p YTConverter
          cp -r build/linux/x64/release/bundle/* YTConverter/

          if [ -f "version.txt" ]; then
            repoVer=$(cat version.txt | tr -d '[:space:]')
            cp version.txt YTConverter/
          else
            repoVer="1.0.0"
            echo "1.0.0" > YTConverter/version.txt
          fi

          if [ -f "YTConverterIcon.png" ]; then
            cp YTConverterIcon.png YTConverter/
          fi

          safe=$(echo "$repoVer" | sed 's/[^a-zA-Z0-9._-]/_/g')
          verZip="YoutubeConverter_Linux_$safe.tar.gz"
          tar -czvf "$verZip" YTConverter
          echo "ver_zip=$verZip" >> $GITHUB_OUTPUT
          echo "ver=$repoVer" >> $GITHUB_OUTPUT

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v3
        with:
          name: linux-build
          path: ${{ steps.linux_pkg.outputs.ver_zip }}

  build-macos:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.16.0"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Prepare macOS package
        id: macos_pkg
        run: |
          mkdir -p YTConverter
          cp -r build/macos/Build/Products/Release/youtube_converter_app.app YTConverter/

          if [ -f "version.txt" ]; then
            repoVer=$(cat version.txt | tr -d '[:space:]')
            cp version.txt YTConverter/
          else
            repoVer="1.0.0"
            echo "1.0.0" > YTConverter/version.txt
          fi

          if [ -f "YTConverterIcon.png" ]; then
            cp YTConverterIcon.png YTConverter/
          fi

          safe=$(echo "$repoVer" | sed 's/[^a-zA-Z0-9._-]/_/g')
          verZip="YoutubeConverter_macOS_$safe.zip"
          zip -r "$verZip" YTConverter
          echo "ver_zip=$verZip" >> $GITHUB_OUTPUT
          echo "ver=$repoVer" >> $GITHUB_OUTPUT

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v3
        with:
          name: macos-build
          path: ${{ steps.macos_pkg.outputs.ver_zip }}

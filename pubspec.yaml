name: youtube_converter
description: A modern YouTube Converter built with Flutter and Material 3 Expressive design.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.6 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2

  # State Management
  provider: ^6.0.5

  # Storage
  shared_preferences: ^2.2.0
  path_provider: ^2.0.15

  # Network & Downloads
  http: ^1.1.0

  # File Operations
  file_picker: ^5.3.0

  # URL Operations
  url_launcher: ^6.1.12

  # UI Components
  google_fonts: ^5.1.0
  flutter_animate: ^4.3.0

  # Utilities
  intl: ^0.18.0
  uuid: ^3.0.7
  archive: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
